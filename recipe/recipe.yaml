schema_version: 1

context:
  version: "1.0.1"

package:
  name: osmfinder
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/osmfinder/osmfinder-${{ version }}.tar.gz
  sha256: 3c2d86535f4cd8066d8a91ed6b687be9dccd8edd6740bd6f6379b9f51bb32f43

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.9.1,<0.10.0
    - pip
  run:
    - python >=${{ python_min }}
    - shapely >=2
    - pyproj >=3
    - pooch >=1.6.0
    - requests
    - beautifulsoup4
    - rich >=12.0.0
    - tqdm >=4.42.0
    - platformdirs >=2
    - anyascii >=0.3.3
    - python-dateutil >=2.8
    - arro3-core >=0.8.0
    - arro3-io >=0.8.0

tests:
  - python:
      imports:
        - osmfinder
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/RaczeQ/osmfinder
  summary: Python library for finding and downloading OpenStreetMap *.osm.pbf extracts by name, id or geometry.
  license: MIT
  license_file: LICENSE.txt
  repository: https://github.com/RaczeQ/osmfinder

extra:
  recipe-maintainers:
    - RaczeQ
